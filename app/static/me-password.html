<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password — Bayaan</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #12100e; color: #f2ece3; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; padding: 32px 34px 28px;
    background: #191612; border: 1px solid #3a332a; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
  }
  h1 { margin: 0 0 4px; font-size: 20px; color: #c8a96a; font-weight: 600; }
  .sub { margin: 0 0 24px; font-size: 13px; color: #a89b88; }
  label { display: block; font-size: 13px; color: #cbbfae; margin: 0 0 6px; }
  input {
    width: 100%; padding: 10px 12px; margin: 0 0 16px;
    background: #100e0b; color: #f2ece3; border: 1px solid #3a332a; border-radius: 6px;
    font: inherit; font-size: 15px;
  }
  input:focus { outline: none; border-color: #c8a96a; box-shadow: 0 0 0 3px rgba(200,169,106,.15); }
  .hint { margin: -10px 0 16px; font-size: 12px; color: #7d7264; }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 6px; cursor: pointer;
    background: #c8a96a; color: #1b1710; font: inherit; font-weight: 600;
  }
  button:hover { background: #d9bb7d; }
  .msg { margin: 0 0 18px; padding: 10px 12px; border-radius: 6px; font-size: 13.5px; }
  .msg.error { background: #3a1e1c; border: 1px solid #6d3330; color: #f0c9c4; }
  .msg.ok { background: #1d2b21; border: 1px solid #35543d; color: #c7e6cf; }
  .back { display: block; margin: 18px 0 0; text-align: center; font-size: 13px; color: #a89b88; }
  .back a { color: #c8a96a; }
</style>
</head>
<body>
  <form class="card" method="post" action="/me/password" autocomplete="off">
    <h1>Change password</h1>
    <p class="sub">Your other devices will be signed out.</p>

    <div id="banner" class="msg" hidden></div>

    <label for="current">Current password</label>
    <input id="current" name="current" type="password" autocomplete="current-password" required autofocus>

    <label for="new">New password</label>
    <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>

    <label for="confirm">Repeat new password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint">At least 8 characters.</p>

    <button type="submit">Change password</button>
    <a class="back" href="/">&larr; Back to Bayaan</a>
  </form>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var banner = document.getElementById("banner");
  var messages = {
    current: "That is not your current password.",
    short: "The new password must be at least 8 characters.",
    mismatch: "The two new passwords did not match."
  };
  var error = q.get("error");
  if (messages[error]) {
    banner.textContent = messages[error];
    banner.className = "msg error";
    banner.hidden = false;
  } else if (q.get("changed")) {
    banner.textContent = "Password changed. Other devices have been signed out.";
    banner.className = "msg ok";
    banner.hidden = false;
  }
})();
</script>
</body>
</html>
