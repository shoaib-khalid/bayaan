<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bayaan — Quran Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  @font-face{font-family:"IndoPak Quran";src:url("https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2") format("woff2");font-display:swap;}
  :root{--paper:#fbf7ea;--paper2:#fffdf5;--ink:#241f17;--muted:#756b5a;--border:#a8946e;--gold:#9c7c3e;
    --cA:#e8eef7;--cB:#f4ecd9;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:#efe9db;color:var(--ink);font-family:"Noto Nastaliq Urdu",serif;overflow:hidden;
    display:flex;flex-direction:column;height:100svh;}
  .bar{flex:0 0 auto;display:flex;gap:10px;align-items:center;justify-content:center;
    padding:8px 12px;background:#fffdf5;border-bottom:1px solid var(--gold);font-family:system-ui,sans-serif;direction:ltr;}
  .bar label{font-size:13px;color:var(--muted);}
  .bar select{font:inherit;font-size:14px;padding:5px 9px;border:1px solid rgba(156,124,62,.5);border-radius:8px;background:#fff;cursor:pointer;}
  .bar .hint{font-size:12px;color:var(--muted);}
  .stage{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;padding:10px 10px 0;overflow:hidden;}
  .book{width:min(calc(100vw - 24px),920px);height:100%;background:var(--paper);border:1px solid var(--border);
    box-shadow:0 12px 34px rgba(42,34,21,.18);display:flex;flex-direction:column;overflow:hidden;}
  .page-head{flex:0 0 auto;text-align:center;padding:10px 18px 4px;border-bottom:1px dashed rgba(156,124,62,.35);}
  .page-head .ar{font-family:"IndoPak Quran",serif;font-size:24px;line-height:1.6;}
  .page-head .en{font-size:15px;color:var(--muted);}
  /* scrollable as a safety net so a word is never clipped away */
  .page-body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 8px;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .page-foot{flex:0 0 auto;text-align:center;color:var(--muted);padding:6px 0 8px;font-family:system-ui,sans-serif;direction:ltr;}
  .navbottom{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:#fffdf5;border-top:1px solid var(--gold);
    font-family:system-ui,sans-serif;direction:ltr;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
  .navbtn{font:inherit;font-size:22px;line-height:1;min-width:120px;padding:10px 14px;border:1px solid rgba(156,124,62,.55);
    border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;}
  .navbtn:disabled{opacity:.35;cursor:default;}
  .navbtn:not(:disabled):active{background:#f0ead8;}
  .navbtn .lbl{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  #pageInfo{font-size:16px;color:var(--muted);white-space:nowrap;}

  .quran{text-align:justify;font-family:"IndoPak Quran",serif;
    font-size:clamp(22px,4.2cqw,42px);line-height:2.05;color:var(--ink);}
  .quran .w{white-space:nowrap;border-radius:6px;padding:0 2px;}
  .quran .w.segA{background:var(--cA);}
  .quran .w.segB{background:var(--cB);}
  .quran .orn{color:var(--gold);white-space:nowrap;}

  .measure{position:absolute;left:-20000px;top:0;visibility:hidden;}
</style>
</head>
<body>
  <div class="bar" dir="ltr">
    <label>Surah <select id="surahSel"></select></label>
    <span style="flex:1"></span>
    <span class="hint">Arrows ← → · swipe</span>
  </div>

  <div class="stage">
    <div class="book">
      <div class="page-head"><div class="ar" id="headAr"></div><div class="en" id="headEn"></div></div>
      <div class="page-body" id="pageBody"><div class="quran" id="page"></div></div>
      <div class="page-foot" id="foot"></div>
    </div>
  </div>

  <div class="navbottom">
    <button class="navbtn" id="btnNext" aria-label="Next page" title="Next page">◀<span class="lbl">next</span></button>
    <span id="pageInfo">–</span>
    <button class="navbtn" id="btnPrev" aria-label="Previous page" title="Previous page">▶<span class="lbl">prev</span></button>
  </div>
  <div class="measure"><div class="quran" id="measureQuran"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const AR=/[\u0621-\u064a\u0671-\u06d3]/;
const isWord=t=>AR.test(t||"");
function toUrdu(n){return String(n).replace(/[0-9]/g,d=>"۰۱۲۳۴۵۶۷۸۹"[+d]);}

const S={surahs:[],surahId:2,ayahs:[],spans:[],pages:[],cur:0};

async function loadSurahs(){S.surahs=await(await fetch("/surahs")).json();
  const sel=$("surahSel");sel.innerHTML="";
  for(const s of S.surahs){const o=document.createElement("option");o.value=s.id;
    o.textContent=`${String(s.id).padStart(3,"0")} — ${s.name_arabic} (${s.name_english})`;sel.appendChild(o);}
  sel.value=String(S.surahId);}

async function loadSurah(){
  const data=await(await fetch(`/surah/${S.surahId}?translation_id=2`)).json();
  const s=S.surahs.find(x=>x.id===S.surahId)||{};
  $("headAr").textContent=s.name_arabic||"";$("headEn").textContent=s.name_english||"";
  S.ayahs=data.ayahs; buildSpans();
}

/* Each ayah renders its ORIGINAL tokens in order: real words are coloured by
   segment (alternating), while the genuine pause/ruku/end-of-ayah glyph tokens
   (e.g. ج, لا, and the ayah medallion) are shown as-is in gold — so there is
   exactly ONE ayah ornament and no separate duplicate number. */
function buildAyahSpan(ayah){
  const segs=ayah.segments||[];
  const color={}; // word_index -> segment colour
  segs.forEach((seg,si)=>{
    const cls=(si%2===0)?"segA":"segB";
    const lo=seg.word_start_index??1, hi=seg.word_end_index??Infinity;
    ayah.words.forEach(w=>{ if(isWord(w.text)&&w.word_index>=lo&&w.word_index<=hi) color[w.word_index]=cls; });
  });
  const span=document.createElement("span"); span.className="ayah";
  let first=true;
  ayah.words.forEach(w=>{
    const sp=document.createElement("span");
    if(isWord(w.text)){ sp.className="w "+(color[w.word_index]||"segA"); }
    else{ sp.className="orn"; }
    sp.textContent=w.text;
    if(!first) span.appendChild(document.createTextNode(" "));
    first=false;
    span.appendChild(sp);
  });
  return span;
}
function buildSpans(){S.spans=S.ayahs.map(buildAyahSpan); document.fonts.ready.then(measure);}

function contentWidth(){const b=document.querySelector(".page-body").getBoundingClientRect();return Math.max(200,b.width-8);}
function measure(){
  const q=$("measureQuran"); q.innerHTML="";
  q.style.width=contentWidth()+"px"; q.style.display="block";
  const top=q.getBoundingClientRect().top;
  S.spans.forEach((s,k)=>{ if(k) q.appendChild(document.createTextNode(" ")); q.appendChild(s.cloneNode(true)); });
  // record each ayah's vertical extent inside the continuous flow
  const rects=Array.from(q.children).map(c=>{const r=c.getBoundingClientRect();return {top:r.top-top,bottom:r.bottom-top};});
  const H=document.querySelector(".page-body").clientHeight-26; // minus paddings + safety margin
  const pages=[];let start=0,i=0;
  for(i=0;i<rects.length;){
    let j=i;while(j<rects.length && rects[j].bottom-rects[i].top<=H+1){j++;}
    j--; // last fitting
    if(j<i)j=i; // single tall ayah
    pages.push(rangeArr(i,j));
    i=j+1;
  }
  S.pages=pages.length?pages:[[]]; S.cur=Math.min(S.cur,S.pages.length-1);
  render();
}
function rangeArr(a,b){const out=[];for(let k=a;k<=b;k++)out.push(k);return out;}
function render(){
  const page=$("page"); page.innerHTML="";
  const idxs=S.pages[S.cur]||[];
  idxs.forEach((k,i)=>{ if(i) page.appendChild(document.createTextNode(" ")); page.appendChild(S.spans[k].cloneNode(true)); });
  $("pageInfo").textContent=`${S.cur+1} / ${S.pages.length}`;
  $("foot").textContent=`${toUrdu(S.cur+1)} / ${toUrdu(S.pages.length)}`;
  $("btnPrev").disabled=S.pages.length<=1||S.cur===0;
  $("btnNext").disabled=S.pages.length<=1||S.cur===S.pages.length-1;
  const pb=$("pageBody"); if(pb) pb.scrollTop=0;
}

function nextPage(){S.cur=Math.min(S.cur+1,S.pages.length-1);render();}
function prevPage(){S.cur=Math.max(S.cur-1,0);render();}
function go(){S.cur=0;loadSurah();}

$("surahSel").addEventListener("change",e=>{S.surahId=+e.target.value;go();});
// RTL mushaf: moving forward = to the LEFT, so the LEFT arrow is “next”.
$("btnNext").addEventListener("click",nextPage);
$("btnPrev").addEventListener("click",prevPage);

// Keyboard navigation (skip while the select is focused).
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="select"||tag==="input")return;
  if(e.key==="ArrowLeft"||e.key==="PageDown"){nextPage();e.preventDefault();}
  else if(e.key==="ArrowRight"||e.key==="PageUp"){prevPage();e.preventDefault();}
  else if(e.key==="Home"){S.cur=0;render();e.preventDefault();}
  else if(e.key==="End"){S.cur=S.pages.length-1;render();e.preventDefault();}
});

// Touch swipe on the reading area: swipe LEFT = next, swipe RIGHT = prev.
(function(){
  const el=document.querySelector(".stage");
  let x0=0,y0=0;
  el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  el.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<40||Math.abs(dy)>Math.abs(dx))return; // too short / vertical scroll
    if(dx<0) nextPage(); else prevPage();
  },{passive:true});
})();
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.spans.length)measure();},150);});

const q=new URLSearchParams(location.search);
if(q.get("surah"))S.surahId=Math.max(1,Math.min(114,+q.get("surah")));
(async()=>{await loadSurahs();await loadSurah();})();
</script>
</body>
</html>
