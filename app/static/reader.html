<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bayaan Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  @font-face {
    font-family: "IndoPak Quran";
    src: url("https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --desk: #e7dcc6;
    --paper: #fbf6ea;
    --ink: #1c1915;
    --muted: #7a6e5c;
    --frame: #8d3a32;
    --gold: #a07c3a;
    --rule: rgba(141, 58, 50, 0.22);
    --ink0: #1c1915;
    --ink1: #9b2c2c;
    --ink2: #1b6a42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: "Noto Nastaliq Urdu", serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, #f3ead6, transparent 60%),
      var(--desk);
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    background: rgba(251, 246, 234, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(141, 58, 50, 0.28);
    font-family: "Segoe UI", system-ui, sans-serif;
    direction: ltr;
  }
  .controls label { font-size: 12px; letter-spacing: .04em; color: var(--muted); }
  .controls select, .controls button {
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid rgba(141, 58, 50, 0.35);
    border-radius: 999px;
    background: #fffdf8;
    color: var(--ink);
    cursor: pointer;
  }
  .controls button.active {
    background: var(--frame);
    border-color: var(--frame);
    color: #fffdf8;
  }

  .book {
    max-width: 980px;
    margin: 28px auto 48px;
    padding: 10px;
    background: var(--paper);
    border: 1.5px solid var(--frame);
    box-shadow:
      inset 0 0 0 6px var(--paper),
      inset 0 0 0 7px rgba(160, 124, 58, 0.55),
      0 18px 50px rgba(60, 36, 18, 0.16);
  }
  .page-head {
    text-align: center;
    padding: 22px 28px 8px;
  }
  .page-head .ar {
    font-family: "IndoPak Quran", serif;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.7;
  }
  .page-head .en {
    margin-top: 2px;
    font-size: 16px;
    color: var(--muted);
  }
  .page-head .tr { margin-top: 2px; font-size: 15px; color: var(--frame); }
  .rule {
    height: 1px;
    width: min(72%, 520px);
    margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, var(--frame), transparent);
  }
  .content { padding: 2px 26px 28px; }

  /* Printed-page rhythm: a full Arabic line, its Urdu tucked close under it,
     then a slightly larger even breath before the next Arabic line. */
  .ayah {
    margin: 0.35em 0 0.15em;
    padding-bottom: 0.35em;
    border-bottom: 1px solid var(--rule);
  }
  .ayah:last-child { border-bottom: 0; }
  .stream {
    --ar: clamp(28px, 3.25vw, 36px);
    --ur: clamp(15px, 1.68vw, 18px);
    direction: rtl;
    padding: 0.55em 0 0.2em;
  }
  .couplet { margin: 0; }
  .couplet .ar,
  .probe .ar {
    font-family: "IndoPak Quran", serif;
    font-size: var(--ar);
    line-height: 1.58;
    margin: 0 0 -0.2em;
    text-align: right;
    text-justify: inter-word;
    white-space: nowrap;
  }
  .couplet .ur,
  .probe .ur {
    font-family: "Noto Nastaliq Urdu", serif;
    font-size: var(--ur);
    line-height: 1.72;
    margin: 0 0 0.28em;
    text-align: right;
    text-justify: inter-word;
    white-space: nowrap;
  }
  .probe .ar,
  .probe .ur { margin: 0; }
  .couplet.full .ar,
  .couplet .ur.flush {
    text-align: justify;
    text-align-last: justify;
  }
  .couplet .w { white-space: nowrap; }
  .couplet .orn { color: var(--gold); white-space: nowrap; }
  .ink0 { color: var(--ink0); }
  .ink1 { color: var(--ink1); }
  .ink2 { color: var(--ink2); }
  .probe {
    position: absolute;
    visibility: hidden;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ---- Line bands (sentence-sized segments) ---- */
  .band { margin: 0.7em 0 1em; }
  .band .ar-line {
    font-family: "IndoPak Quran", serif;
    font-size: clamp(26px, 3.2vw, 34px);
    line-height: 1.9;
  }
  .band .ar-line .w { white-space: nowrap; }
  .band .ur-line {
    margin: 0 0 0.35em;
    font-size: 18px;
    line-height: 2;
  }
  .band .orn { color: var(--gold); }

  /* ---- Continuous Arabic, translation under the ayah ---- */
  .flow-ayah { margin: 0.9em 0 1.1em; }
  .flow-ar {
    font-family: "IndoPak Quran", serif;
    font-size: clamp(24px, 3vw, 32px);
    line-height: 2.15;
    text-align: justify;
  }
  .flow-ar .w { padding: 0 1px; }
  .flow-ar .orn { color: var(--gold); }
  .flow-tr {
    margin-top: 0.15em;
    font-size: 17px;
    line-height: 2;
  }

  .note {
    text-align: center;
    color: var(--muted);
    font-size: 17px;
    padding: 28px 12px;
  }

  @media (max-width: 640px) {
    .book { margin: 12px 8px 28px; }
    .content { padding: 2px 14px 24px; }
  }
</style>
</head>
<body>
  <div class="controls">
    <label>Surah
      <select id="surahSel"></select>
    </label>
    <label>Translation
      <select id="trSel">
        <option value="1">bayan-ul-quran</option>
        <option value="2" selected>fateh-muhammad-jalandhry</option>
      </select>
    </label>
    <button id="btnPhrase" class="active" type="button">Phrase</button>
    <button id="btnInter" type="button">Lines</button>
    <button id="btnFlow" type="button">Flowing</button>
  </div>

  <div class="book">
    <div class="page-head" id="pageHead"></div>
    <div class="content" id="content">
      <p class="note">Loading…</p>
    </div>
  </div>

<script>
  const INKS = ["ink0", "ink1", "ink2"];

  const surahSel = document.getElementById("surahSel");
  const trSel = document.getElementById("trSel");
  const head = document.getElementById("pageHead");
  const content = document.getElementById("content");
  let layout = "phrase";

  for (let s = 1; s <= 114; s++) {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = String(s).padStart(3, "0");
    surahSel.appendChild(o);
  }

  const params = new URLSearchParams(location.search);
  let surah = parseInt(params.get("surah") || "2", 10);
  let trId = parseInt(params.get("translation_id") || "2", 10);
  if (params.get("layout") === "inter" || params.get("layout") === "flow") {
    layout = params.get("layout");
  }
  surahSel.value = surah;
  trSel.value = trId;
  syncLayoutButtons();

  function syncLayoutButtons() {
    document.getElementById("btnPhrase").classList.toggle("active", layout === "phrase");
    document.getElementById("btnInter").classList.toggle("active", layout === "inter");
    document.getElementById("btnFlow").classList.toggle("active", layout === "flow");
  }

  function setLayout(name) {
    layout = name;
    syncLayoutButtons();
    const url = new URL(location.href);
    url.searchParams.set("layout", name);
    history.replaceState(null, "", url.pathname + url.search);
    render();
  }

  async function load() {
    content.innerHTML = '<p class="note">Loading…</p>';
    const res = await fetch(`/surah/${surah}?translation_id=${trId}`);
    if (!res.ok) {
      content.innerHTML = `<p class="note">API error ${res.status}</p>`;
      return;
    }
    const data = await res.json();
    head.innerHTML = `
      <div class="ar">${data.surah.name_arabic || ""}</div>
      <div class="en">${data.surah.name_english || ""} — سورۃ ${toUrdu(surah)}</div>
      <div class="tr">${labelFor(data.translation)}</div>
      <div class="rule"></div>`;
    window._data = data;
    render();
  }

  function render() {
    const data = window._data;
    if (!data) return;
    content.innerHTML = "";
    if (layout === "phrase") {
      content.appendChild(renderPhraseSurah(data.ayahs));
    } else {
      for (const ayah of data.ayahs) {
        content.appendChild(layout === "inter" ? renderInterlinear(ayah) : renderFlow(ayah));
      }
    }
    if (layout === "phrase") {
      fitPhraseWidths();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (layout === "phrase") fitPhraseWidths(); });
      }
    }
  }

  /* One Arabic word plus the Urdu tokens that belong with it. */
  function buildUnits(ayahs) {
    const units = [];
    let n = 0;
    for (const ayah of ayahs) {
      const { orn } = wordsAndOrnament(ayah);
      const ornText = orn.map((o) => o.text).join(" ");
      const last = ayah.segments[ayah.segments.length - 1];
      for (const seg of ayah.segments) {
        const words = segmentWords(ayah, seg);
        const ink = INKS[n % INKS.length];
        n += 1;
        const urTokens = (seg.translation_text || "").trim().split(/\s+/).filter(Boolean);
        const count = Math.max(words.length, 1);
        words.forEach((w, i) => {
          const from = Math.floor((i * urTokens.length) / count);
          const to = Math.floor(((i + 1) * urTokens.length) / count);
          const endOfAyah = seg === last && i === words.length - 1;
          units.push({
            ink,
            ar: w.text,
            ur: urTokens.slice(from, to).join(" "),
            orn: endOfAyah ? ornText : "",
          });
        });
      }
    }
    return units;
  }

  function textWidth(el, text) {
    el.textContent = text;
    return el.getBoundingClientRect().width;
  }

  /* Printed mushafs fill a short Arabic line by elongating letters (kashida),
     not by opening large gaps between words. */
  const RIGHT_JOINING = new Set("اأإآٱءدذرزوؤةڈڑژے".split(""));
  const ALEF_LIKE = new Set("اأإآٱ".split(""));

  function letterClusters(word) {
    const out = [];
    for (const ch of word) {
      if (/\p{M}/u.test(ch) && out.length) out[out.length - 1].marks += ch;
      else out.push({ base: ch, marks: "" });
    }
    return out;
  }

  function kashidaSpots(clusters) {
    const spots = [];
    for (let i = 0; i < clusters.length - 1; i++) {
      const base = clusters[i].base;
      const next = clusters[i + 1].base;
      if (RIGHT_JOINING.has(base)) continue;
      if (base === "ل" && ALEF_LIKE.has(next)) continue;
      if (!/\p{L}/u.test(next)) continue;
      let pri = 1;
      if ("سشصضطظ".includes(base)) pri = 5;
      else if ("بتثنيئىیپ".includes(base)) pri = 4;
      else if ("كکفقگ".includes(base)) pri = 3;
      else if ("عغ".includes(base)) pri = 2;
      spots.push({ i, pri });
    }
    return spots;
  }

  function paintKashida(word, perSpot) {
    const clusters = letterClusters(word);
    let out = "";
    for (let i = 0; i < clusters.length; i++) {
      out += clusters[i].base + clusters[i].marks;
      const n = perSpot[i] || 0;
      if (n) out += "\u0640".repeat(n);
    }
    return out;
  }

  function stretchArabic(words, target, tatweelW, probe) {
    const plain = words.slice();
    const natural = textWidth(probe, words.join(" "));
    plain._fill = target > 0 ? natural / target : 1;
    if (words.length < 2 || tatweelW < 1) return plain;
    const extra = target - natural;
    if (extra < 14) return plain;

    const analyzed = words.map((w) => {
      const clusters = letterClusters(w);
      return { clusters, spots: kashidaSpots(clusters) };
    });
    const order = [];
    analyzed.forEach((a, wi) => {
      a.spots.forEach((sp) => order.push({ wi, i: sp.i, pri: sp.pri }));
    });
    if (!order.length) return plain;
    order.sort((a, b) => b.pri - a.pri || a.wi - b.wi || b.i - a.i);

    const maxEach = 3;
    const apply = (count) => {
      const used = analyzed.map((a) => new Array(a.clusters.length).fill(0));
      let left = count;
      while (left > 0) {
        let moved = false;
        for (const sp of order) {
          if (left <= 0) break;
          if (used[sp.wi][sp.i] >= maxEach) continue;
          used[sp.wi][sp.i] += 1;
          left -= 1;
          moved = true;
        }
        if (!moved) break;
      }
      return analyzed.map((a, wi) => paintKashida(words[wi], used[wi]));
    };

    let count = Math.min(order.length * maxEach, Math.floor((extra * 0.92) / tatweelW));
    let result = apply(count);
    let width = textWidth(probe, result.join(" "));
    let tries = 0;
    while (width > target - 2 && count > 0 && tries < 5) {
      count = Math.max(0, count - Math.max(1, Math.ceil((width - (target - 8)) / tatweelW)));
      result = apply(count);
      width = textWidth(probe, result.join(" "));
      tries += 1;
    }
    result._fill = target > 0 ? width / target : 1;
    return result;
  }

  /* Pack words into full lines. Arabic fills the measure; Urdu of those
     words must still fit on the line beneath at the Urdu size. */
  function fitPhraseWidths() {
    const stream = content.querySelector(".stream");
    if (!stream || !stream._units) return;
    const units = stream._units;
    const max = stream.clientWidth || content.clientWidth || 640;
    if (max < 40 || !units.length) return;

    const probe = document.createElement("div");
    probe.className = "probe";
    const arProbe = document.createElement("span");
    arProbe.className = "ar";
    const urProbe = document.createElement("span");
    urProbe.className = "ur";
    probe.append(arProbe, urProbe);
    stream.appendChild(probe);

    const arSpace = Math.max(0, textWidth(arProbe, "ب ب") - textWidth(arProbe, "بب"));
    const urSpace = Math.max(0, textWidth(urProbe, "ب ب") - textWidth(urProbe, "بب"));
    const tatweelW = Math.max(1, textWidth(arProbe, "بـب") - textWidth(arProbe, "بب"));
    const arW = new Array(units.length);
    const urW = new Array(units.length);
    const ornW = new Array(units.length);
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      arW[i] = textWidth(arProbe, u.ar);
      urW[i] = u.ur ? textWidth(urProbe, u.ur) : 0;
      ornW[i] = u.orn ? textWidth(arProbe, u.orn) : 0;
    }
    const lines = [];
    let i = 0;
    while (i < units.length) {
      let j = i;
      let aSum = 0;
      let uSum = 0;
      let aWords = 0;
      let uWords = 0;
      while (j < units.length) {
        const nextA = aSum + (aWords ? arSpace : 0) + arW[j] + (ornW[j] ? arSpace + ornW[j] : 0);
        const uAdd = urW[j];
        const nextU = uSum + (uWords && uAdd ? urSpace : 0) + uAdd;
        const limit = max * 0.985;
        if (j > i && (nextA > limit || nextU > limit)) break;
        aSum = nextA;
        uSum = nextU;
        aWords += 1;
        if (uAdd) uWords += 1;
        j += 1;
      }
      if (j === i) j = i + 1;
      lines.push({ i, j, aSum, uSum });
      i = j;
    }

    stream.replaceChildren();
    stream.appendChild(probe);
    for (let li = 0; li < lines.length; li++) {
      const ln = lines[li];
      const slice = units.slice(ln.i, ln.j);
      const ornWidth = slice.reduce((sum, u) => (u.orn ? sum + arSpace + textWidth(arProbe, u.orn) : sum), 0);
      const target = Math.max(40, max - ornWidth - 8);
      const stretched = stretchArabic(slice.map((u) => u.ar), target, tatweelW, arProbe);
      const couplet = document.createElement("div");
      const arabicFull = slice.length > 1 && stretched._fill >= 0.9;
      couplet.className = "couplet" + (arabicFull ? " full" : "");

      const ar = document.createElement("div");
      ar.className = "ar";
      ar.lang = "ar";
      slice.forEach((u, k) => {
        if (k) ar.appendChild(document.createTextNode(" "));
        const s = document.createElement("span");
        s.className = "w " + u.ink;
        s.textContent = stretched[k];
        ar.appendChild(s);
        if (u.orn) {
          ar.appendChild(document.createTextNode(" "));
          const o = document.createElement("span");
          o.className = "orn";
          o.textContent = u.orn;
          ar.appendChild(o);
        }
      });

      const ur = document.createElement("div");
      ur.className = "ur" + (ln.uSum >= max * 0.78 ? " flush" : "");
      ur.lang = "ur";
      let wroteUr = false;
      slice.forEach((u) => {
        if (!u.ur) return;
        if (wroteUr) ur.appendChild(document.createTextNode(" "));
        wroteUr = true;
        const s = document.createElement("span");
        s.className = u.ink;
        s.textContent = u.ur;
        ur.appendChild(s);
      });

      couplet.appendChild(ar);
      if (wroteUr) couplet.appendChild(ur);
      stream.appendChild(couplet);
    }
    probe.remove();
  }

  function wordsAndOrnament(ayah) {
    return {
      words: ayah.words.filter((w) => w.is_word),
      orn: ayah.words.filter((w) => !w.is_word),
    };
  }

  function segmentWords(ayah, seg) {
    const lo = seg.word_start_index ?? 1;
    const hi = seg.word_end_index ?? Infinity;
    return ayah.words.filter((w) => w.is_word && w.word_index >= lo && w.word_index <= hi);
  }

  function fillArabic(parent, words) {
    words.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w";
      s.textContent = w.text;
      parent.appendChild(s);
      if (i < words.length - 1) parent.appendChild(document.createTextNode(" "));
    });
  }

  function appendOrnament(parent, orn) {
    for (const o of orn) {
      const s = document.createElement("span");
      s.className = "orn";
      s.textContent = o.text;
      parent.appendChild(document.createTextNode(" "));
      parent.appendChild(s);
    }
  }

  /* One continuous stream: ayahs do not start a new line. */
  function renderPhraseSurah(ayahs) {
    const stream = document.createElement("div");
    stream.className = "stream";
    stream._units = buildUnits(ayahs);
    return stream;
  }

  function renderInterlinear(ayah) {
    const article = document.createElement("article");
    article.className = "ayah";
    const { orn } = wordsAndOrnament(ayah);
    const last = ayah.segments[ayah.segments.length - 1];

    ayah.segments.forEach((seg) => {
      const ink = INKS[(seg.segment_index - 1) % INKS.length];
      const band = document.createElement("div");
      band.className = "band";
      const ar = document.createElement("div");
      ar.className = "ar-line " + ink;
      ar.lang = "ar";
      fillArabic(ar, segmentWords(ayah, seg));
      if (seg === last) appendOrnament(ar, orn);
      const ur = document.createElement("div");
      ur.className = "ur-line " + ink;
      ur.lang = "ur";
      ur.textContent = seg.translation_text;
      band.appendChild(ar);
      band.appendChild(ur);
      article.appendChild(band);
    });
    return article;
  }

  function renderFlow(ayah) {
    const article = document.createElement("article");
    article.className = "ayah flow-ayah";
    const { orn } = wordsAndOrnament(ayah);

    const ar = document.createElement("div");
    ar.className = "flow-ar";
    ar.lang = "ar";

    const colorOf = new Map();
    ayah.segments.forEach((seg) => {
      const ink = INKS[(seg.segment_index - 1) % INKS.length];
      for (const w of segmentWords(ayah, seg)) colorOf.set(w.word_index, ink);
    });

    let first = true;
    for (const w of ayah.words) {
      if (!first) ar.appendChild(document.createTextNode(" "));
      first = false;
      const s = document.createElement("span");
      if (w.is_word) {
        s.className = "w " + (colorOf.get(w.word_index) || "ink0");
        s.textContent = w.text;
      } else {
        s.className = "orn";
        s.textContent = w.text;
      }
      ar.appendChild(s);
    }
    if (!orn.length) { /* ornaments already walked via ayah.words */ }
    article.appendChild(ar);

    ayah.segments.forEach((seg) => {
      const ink = INKS[(seg.segment_index - 1) % INKS.length];
      const tr = document.createElement("div");
      tr.className = "flow-tr " + ink;
      tr.lang = "ur";
      tr.textContent = seg.translation_text;
      article.appendChild(tr);
    });
    return article;
  }

  function labelFor(translation) {
    if (translation.id === 1) return "بیان القرآن";
    if (translation.id === 2) return "فتح محمد جالندھری";
    return translation.name || "";
  }

  function toUrdu(n) {
    return String(n).replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[+d]);
  }

  function go() {
    surah = parseInt(surahSel.value, 10);
    trId = parseInt(trSel.value, 10);
    history.replaceState(null, "", `/reader?translation_id=${trId}&surah=${surah}&layout=${layout}`);
    load();
  }

  surahSel.addEventListener("change", go);
  trSel.addEventListener("change", go);
  document.getElementById("btnPhrase").addEventListener("click", () => setLayout("phrase"));
  document.getElementById("btnInter").addEventListener("click", () => setLayout("inter"));
  document.getElementById("btnFlow").addEventListener("click", () => setLayout("flow"));
  window.addEventListener("resize", () => { if (layout === "phrase") fitPhraseWidths(); });

  load();
</script>
</body>
</html>
